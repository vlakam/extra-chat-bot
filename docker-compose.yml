version: '3.0'

services:
  node:
    build:
      context: .
    # image: vlakam/extra-chat-bot
    env_file: .env
    restart: always
    depends_on:
      - mongo
    networks:
      - database_nw
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    restart: always
    image: mongo:5
    volumes:
      - ./mongo:/data/db
#    ports:
#      - 27017:27017
    networks:
      - database_nw

networks:
  database_nw:
    driver: bridge
